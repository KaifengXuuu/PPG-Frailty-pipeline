# Run with --upstream-study pointing at the completed stage6_regula_search
# directory.  This ablation changes only the explicit DL tensor channel view.
schema_version: ppg_frailty.hyperparameter_study_plan.v1
study:
  study_id: stage_ablation_channels_inception_v1
  study_type: dependent_channel_ablation
  purpose: "Compare full eight-channel, PPG-only and IMU-only DL views on the selected InceptionTimeFull architecture and training state."
  flow_position: "Channel ablation after batch/LR and regularization tuning."
  decision_role: ablation
  thesis_sections:
    - "InceptionTime input-channel ablation"
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
base:
  catalog_entry: inception_full
  output_group: raw
  profile_id: v2_core_b0_b2_b7_selected
  common_overrides:
    signal.dl_resampling.enabled: true
    signal.dl_resampling.target_fs_hz: 64.0
    signal.normalization.raw_ppg: per_window_median_iqr_over_1p349_sd_finite
    signal.normalization.raw_imu: none
    windows.raw_dl.length_s: 5.0
    windows.raw_dl.hop_s: 2.5
    training.optimizer: adamw
    training.sampler: exhaustive_shuffle_without_replacement
    training.class_weighting: outer_train_window_inverse_frequency
    training.class_count_basis: row
    aggregation.balance_line: line_b_equal_role_families
candidates:
  - case_id: channels_full8_reference
    label: "RED+IR+ACC+gyro (8 channels)"
    overrides:
      model.input_channels: 8
      model.input_channels_resolution: canonical_frailty_raw_8
      model.input_channel_order: [RED, IR, A_dyn_x, A_dyn_y, A_dyn_z, GX, GY, GZ]
    rationale: "Selected full eight-channel DL input reference."
  - case_id: channels_ppg_red_ir
    label: "RED+IR (pure PPG)"
    overrides:
      model.input_channels: 2
      model.input_channels_resolution: explicit_frailty_raw_channel_subset
      model.input_channel_order: [RED, IR]
    rationale: "PPG-only model-input ablation; physical IMU preprocessing remains available to non-DL modules."
  - case_id: channels_imu_acc_gyro
    label: "ACC+gyro (pure IMU)"
    overrides:
      model.input_channels: 6
      model.input_channels_resolution: explicit_frailty_raw_channel_subset
      model.input_channel_order: [A_dyn_x, A_dyn_y, A_dyn_z, GX, GY, GZ]
    rationale: "IMU-only model-input ablation using EKF dynamic acceleration and calibrated gyro views."
resource:
  epochs: 10
  repeats: [0, 1, 2, 3, 4]
  folds: [0, 1, 2, 3, 4]
  ranking_metric: balanced_accuracy
  tie_break_metric: macro_f1
execution:
  jobs: 1
  device: cuda
  parallel_level: cases
  continue_on_error: false
  allow_parallel_deep: false
  measure_operational_costs: false
output:
  root: artifacts/studies/static_line_b_staged_v2
report:
  top_k: 3
  write_html: true
  write_static_figures: true
  calibration_bins: 10
  figure_modules: [all]
  compact_mean_sd: true
  write_excel_workbook: true
