# Resource-aware tuning only.  The first rung uses one participant-grouped
# fold from each of the five split seeds (5 cells/candidate) for five epochs.
# The deterministic top three are then retrained from scratch on the complete
# 5x5 tuning-CV resource for fixed10.  Neither rung is a final test.
schema_version: ppg_frailty.hyperparameter_study_plan.v1
study:
  study_id: staged_static_06_batch_lr_successive_halving_v1
  study_type: successive_halving
  purpose: "Tune batch size and learning rate for InceptionTimeFull using a reduced-resource first rung and complete 5x5 tuning CV for promoted configurations."
  flow_position: "Stage 6 after B0/B2/B7 selection and before regularization/channel ablations."
  decision_role: screening
  thesis_sections:
    - "Successive-halving batch-size and learning-rate tuning"
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
base:
  catalog_entry: inception_full
  output_group: raw
  profile_id: v2_core_b0_b2_b7_selected
  common_overrides:
    signal.dl_resampling.enabled: true
    signal.dl_resampling.target_fs_hz: 64.0
    signal.normalization.raw_ppg: per_window_median_iqr_over_1p349_sd_finite
    signal.normalization.raw_imu: none
    windows.raw_dl.length_s: 5.0
    windows.raw_dl.hop_s: 2.5
    training.optimizer: adamw
    training.sampler: exhaustive_shuffle_without_replacement
    training.class_weighting: outer_train_window_inverse_frequency
    training.class_count_basis: row
    aggregation.balance_line: line_b_equal_role_families
candidates:
  - case_id: b16_lr1e-4
    label: "batch=16; LR=1e-4"
    overrides: {training.batch_size: 16, training.learning_rate: 0.0001}
    rationale: "Small batch and conservative learning rate."
  - case_id: b16_lr3e-4
    label: "batch=16; LR=3e-4"
    overrides: {training.batch_size: 16, training.learning_rate: 0.0003}
    rationale: "Small batch and intermediate learning rate."
  - case_id: b16_lr1e-3
    label: "batch=16; LR=1e-3"
    overrides: {training.batch_size: 16, training.learning_rate: 0.001}
    rationale: "Small batch and B0 learning rate."
  - case_id: b32_lr1e-4
    label: "batch=32; LR=1e-4"
    overrides: {training.batch_size: 32, training.learning_rate: 0.0001}
    rationale: "B0 batch size and conservative learning rate."
  - case_id: b32_lr3e-4
    label: "batch=32; LR=3e-4"
    overrides: {training.batch_size: 32, training.learning_rate: 0.0003}
    rationale: "B0 batch size and intermediate learning rate."
  - case_id: b32_lr1e-3
    label: "batch=32; LR=1e-3"
    overrides: {training.batch_size: 32, training.learning_rate: 0.001}
    rationale: "Exact B0 optimizer/batch/LR reference within the selected V2-core state."
resource:
  screen_epochs: 5
  screen_repeats: [0, 1, 2, 3, 4]
  screen_folds: [0]
  promotion_epochs: 10
  promotion_repeats: [0, 1, 2, 3, 4]
  promotion_folds: [0, 1, 2, 3, 4]
  promote_count: 3
  ranking_metric: balanced_accuracy
  tie_break_metric: macro_f1
execution:
  jobs: 1
  device: cuda
  parallel_level: cases
  continue_on_error: false
  allow_parallel_deep: false
  measure_operational_costs: false
output:
  root: artifacts/studies/static_line_b_staged_v2
report:
  top_k: 6
  write_html: true
  write_static_figures: true
  calibration_bins: 10
  figure_modules: [all]
  compact_mean_sd: true
  write_excel_workbook: true
