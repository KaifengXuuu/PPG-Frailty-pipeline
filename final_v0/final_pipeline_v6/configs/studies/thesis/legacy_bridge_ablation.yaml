# Two models x eight independent B0-to-Bk profiles x five repeats x five folds.
# Frozen execution source: final_pipeline_v2/artifacts/studies/static_line_b_staged_v2/
# 20260821_162454_catalog_sweep_staged-static-03-centered-star-v1/raw/*/resolved_config.yaml
# Shared anchors retain the original IMU EKF parameters, especially required by B3.
# The bridge controls below own sampling, windowing, normalization and training;
# generic raw-config defaults do not replace those field-driven controls.
# Unused feature-matrix metadata uses the current V5 schema, not retired fixed-K
# 115x150 metadata: this study extracts raw windows, never a feature matrix.
# This is fixed-10 centered-star training, not the earlier outer-label early-stop study.
schema_version: ppg_frailty.study_plan.v2
study:
  study_id: thesis_legacy_bridge_ablation
  kind: catalog_sweep
  purpose: Reproduce the historical two-model B0-to-B7 centered-star ablation with explicit execution controls from
    its recorded 20260821 configurations.
  flow_position: Restarted Stage 3 before ensemble, SQI/motion, finalist ablations, and stage-last ShapeFormer.
  decision_role: ablation
  reference_case_id: compact_cnn__b0_star_fixed10
  thesis_sections:
  - '4.2.4.1 / Tables 29-30: centered legacy-to-V2 raw-model ablation'
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
  scope: selected_ordinary
search:
  method: deterministic_sparse_profiles
  selection_seed: 42
  runtime_sampling: false
  interpretation: B0 is the centre. Every B1-B7 case changes only its declared factor from B0; no adjacent Bk-to-B(k+1)
    or cross-model contrast is permitted.
  controlled_factors:
  - Frozen repeats 0-4 and frozen folds 0-4
  - Training seed 42
  - Ten fixed epochs without early stopping or outer-label checkpoint selection
  - Identical model-neutral B profile controls for both architectures
  notes:
  - Eight profiles times two models produce 16 cases and 400 repeat/fold cells.
  - B7 changes only the native primary report aggregation; its training inputs and OOF window probabilities must
    equal B0 within each model.
