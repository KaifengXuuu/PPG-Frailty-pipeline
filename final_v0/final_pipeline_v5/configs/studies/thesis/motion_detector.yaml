# Parameters from V2 20260820_225546_staged-static-05-pre-motion-ptt-v1/resolved_plan.yaml.
# --source-root ../final_pipeline_v2 reads the historical comparison weights only;
# all new training and exports remain in V5 pipeline_output/model_config.
schema_version: ppg_frailty.stage5_pre_motion_ptt.v1
study_type: stage5_pre_motion_ptt
study_id: thesis-motion-detector
purpose: Compare Frailty29-trained and PTT22-trained motion detectors with frozen cross-dataset evaluation.
execution: {motion: true, denoiser: false}

ptt_dataset:
  dataset_id: ptt_ppg_1_1_0_local
  root: physionet.org/files/pulse-transit-time-ppg/1.1.0
  participant_count: 22
  record_count: 66
  activities: [sit, walk, run]
  distal_channels: {RED: pleth_1, IR: pleth_2}
  ecg_peak_annotation_column: peaks
  source_fs_hz: 500.0
  pipeline_fs_hz: 400.0
  independence_claim: none_same_ptt_cohort_used_for_external_characterization

motion_detector:
  internal_entry: formal_internal_motion_reference_source_bound_v2
  internal_dataset: frailty29
  split: {method: StratifiedGroupKFold, groups: participant_id, folds: 5, repeats: 1, seed: 42}
  internal_participant_count: 29
  external_entry: formal_ptt_motion_reference_source_bound_v2
  training_device: cuda
  external_fit_or_recalibration: false
  external_labels: {sit: static, walk: motion, run: motion}
  reverse_ablation:
    enabled: true
    training_dataset: ptt_ppg_1_1_0_local
    evaluation_dataset: frailty29
    split_registry: splits/ptt_formal_repeated_grouped_5x5_v2.csv
    repeat_indices: [0]
    folds: [0, 1, 2, 3, 4]
    split_seed: 42
    evaluation_fit_or_recalibration: false

motion_model_comparison:
  legacy_frailty29_stage5_study: artifacts/studies/static_line_b_staged_v2/20260820_182324_staged-static-05-pre-motion-ptt-v1
  candidates: [frailty29_trained_legacy_reference, ptt22_trained_reverse_ablation]
  downstream_role: comparison_only_single_factor_motion_detector_training_dataset
  candidate_bound_preprocessing_required: true

report:
  formats: [markdown, html, json, csv, png]
  required_detector_figures:
    - motion_internal_confusion_matrix
    - motion_internal_subject_confusion_matrix
    - motion_ptt_confusion_matrix
    - motion_ptt_subject_confusion_matrix
    - motion_ptt_training_oof_confusion_matrix
    - motion_ptt_training_oof_subject_confusion_matrix
    - motion_internal_reverse_confusion_matrix
    - motion_internal_reverse_subject_confusion_matrix
    - motion_training_learning_curves
  denoiser_figures_when_enabled: [denoiser_interval_rmse, denoiser_beat_f1, denoiser_runtime]
  aggregation: participant_macro_with_separate_activity_group_and_wavelength

result_backup:
  enabled: true
  include: [resolved_plan, study_manifest, reports, tables, figures, outputs_index]
  exclude: [source_dataset, duplicate_model_files, duplicate_prediction_parquet]
