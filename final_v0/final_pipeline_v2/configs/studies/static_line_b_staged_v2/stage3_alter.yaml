# Stage 3 executable Legacy Bridge protocol. Phase 0 is an optional advisory
# audit and never gates, changes, or stops training. Historical controls remain
# isolated from canonical V2 overrides.
schema_version: ppg_frailty.study_plan.v2
study:
  study_id: staged_static_03_legacy_v2_bridge_v2
  kind: catalog_sweep
  purpose: "Diagnose the historical-to-V2 result gap with an advisory data-integrity audit and a frozen adjacent-profile ablation chain."
  flow_position: "Stage 3 after ordinary route screening and before ensemble, SQI/motion, sequential finalist ablations, and stage-last ShapeFormer."
  decision_role: ablation
  reference_case_id: compact_cnn__l0_legacy64_w15_fixed10
  thesis_sections:
    - "Legacy-to-V2 data and source integrity audit"
    - "Raw-model preprocessing and balance-policy bridge"
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
  scope: selected_ordinary
search:
  method: deterministic_sparse_profiles
  selection_seed: 42
  runtime_sampling: false
  interpretation: "The catalog supplies architecture provenance only. Legacy bridge profiles are declared below and are not canonical V2 overrides."
  controlled_factors:
    - "Repeat 0 and frozen folds 0-4"
    - "Training seed 42"
    - "Ten fixed epochs without early stopping or outer-label checkpoint selection"
    - "Fresh current CSV bytes independent of Phase 0 status; historical caches are audit evidence only"
  notes:
    - "L5 to L6 jointly changes the sampler hierarchy and the class-weight population; it is not sampler-only evidence."
    - "Inception L0 is a historical-input plausibility check and does not support an Inception ablation conclusion."
    - "CompactCNN execution order differs from numeric reporting order; the L7 to L5 execution jump is not causal evidence."
cases:
  - case_id: inception_full__l0_legacy64_w15_fixed10
    catalog_entry: inception_full
    screen_profile_id: legacy_bridge_l0
    output_group: raw
    overrides: {}
    rationale: "InceptionTimeFull single-network architecture under the complete L0 historical-approximate input and training contract."
    formal_profile: null
  - case_id: compact_cnn__l7_v2_training_bundle_fixed10
    catalog_entry: compact_cnn
    screen_profile_id: legacy_bridge_l7
    output_group: raw
    overrides: {}
    rationale: "CompactCNN L7; execute first but compare only with numeric predecessor L6."
    formal_profile: null
  - case_id: compact_cnn__l5_uniform_replacement_fixed10
    catalog_entry: compact_cnn
    screen_profile_id: legacy_bridge_l5
    output_group: raw
    overrides: {}
    rationale: "CompactCNN L5; uniform replacement mechanics with historical window-count class weights."
    formal_profile: null
  - case_id: compact_cnn__l6_v2_line_b_balance_fixed10
    catalog_entry: compact_cnn
    screen_profile_id: legacy_bridge_l6
    output_group: raw
    overrides: {}
    rationale: "CompactCNN L6; Line-B hierarchy sampling plus V2 participant-count class weights as one named balance-policy bundle."
    formal_profile: null
  - case_id: compact_cnn__l4_v2_imu_fold_scaled_fixed10
    catalog_entry: compact_cnn
    screen_profile_id: legacy_bridge_l4
    output_group: raw
    overrides: {}
    rationale: "CompactCNN L4; change IMU normalization from per-window to outer-training-participant-only scaling."
    formal_profile: null
  - case_id: compact_cnn__l3_v2_imu_window_scaled_fixed10
    catalog_entry: compact_cnn
    screen_profile_id: legacy_bridge_l3
    output_group: raw
    overrides: {}
    rationale: "CompactCNN L3; V2 IMU units, B calibration, EKF and dynamic-acceleration semantics while retaining per-window scaling."
    formal_profile: null
  - case_id: compact_cnn__l2_legacy400_w5_fixed10
    catalog_entry: compact_cnn
    screen_profile_id: legacy_bridge_l2
    output_group: raw
    overrides: {}
    rationale: "CompactCNN L2; change only the deep-learning sample rate from 64 Hz to 400 Hz."
    formal_profile: null
  - case_id: compact_cnn__l1_legacy64_w5_fixed10
    catalog_entry: compact_cnn
    screen_profile_id: legacy_bridge_l1
    output_group: raw
    overrides: {}
    rationale: "CompactCNN L1; change only the window plan from historical 15/3/90-percent to complete 5/2.5/cap-128."
    formal_profile: null
  - case_id: compact_cnn__l0_legacy64_w15_fixed10
    catalog_entry: compact_cnn
    screen_profile_id: legacy_bridge_l0
    output_group: raw
    overrides: {}
    rationale: "CompactCNN complete L0 historical-approximate input and training baseline."
    formal_profile: null
legacy_bridge:
  schema_version: ppg_frailty.legacy_v2_bridge_protocol.v1
  protocol_id: revised_9_case_legacy_v2_bridge_advisory_audit
  source_specification: AA_TODO/old_version_compare_V2/CODEX_LEGACY_V2_BRIDGE_REVISED_9_CASES_WITH_PHASE0.md
  source_specification_sha256: 7ad847a630f81e76304c8d7a38924a8c2b0ca9b16f9344488ade750cbee3c49b
  runtime_status: implemented_advisory_audit_v1
  phase0:
    enabled: true
    advisory_only: true
    mandatory: false
    affects_training_execution: false
    manifest_path: manifests/internal_records_v2.csv
    manifest_expected_rows: 261
    split_path: splits/sgkf5_repeated_grouped_5x5_v2.csv
    static_discovery_globs:
      - StudyData/*.csv
      - TestDataYoungers/*.csv
    historical_label_mapping:
      StudyData/FRAILTY-STATUS=2: Pre-Frail
      StudyData/FRAILTY-STATUS=3: Robust/Non-Frail
      TestDataYoungers: Young
    static_expected_record_count: 145
    static_expected_participant_count: 29
    static_expected_class_counts:
      Pre-Frail: 9
      Robust/Non-Frail: 12
      Young: 8
    static_required_roles: [B, R1, R2, R3, R4]
    required_channel_order: [RED, IR, AX, AY, AZ, GX, GY, GZ]
    manifest_audit_checks:
      - recompute_each_raw_file_SHA256_and_compare_row_source_hash
      - independently_read_CSV_and_verify_required_channel_set_and_order
      - compare_n_samples_duration_participant_class_role_sampling_rate_and_channel_schema
      - count_nonfinite_all_missing_internal_edge_gaps_flat_constant_runs
      - detect_duplicate_source_hashes_and_duplicate_record_identities
      - recompute_complete_manifest_file_hash_and_record_manifest_version
    historical_discovery_checks:
      - independently_reconstruct_discovery_without_using_manifest_as_proof
      - build_explicit_suffix_removal_participant_alias_table
      - require_one_to_one_alias_mapping
      - compare_exact_source_path_and_source_hash_without_fuzzy_filename_matching
      - compare_record_id_participant_role_class_samples_and_channel_schema
    imu_audit_checks:
      - report_raw_B_acceleration_norm_median_IQR_P01_P99
      - report_raw_B_gyro_axis_median_RMS_P01_P99_and_nonfinite_constant_runs
      - report_declared_conversion_acceleration_m_per_s2_and_gyro_rad_per_s
      - report_B_calibration_identity_biases_initial_roll_pitch_and_EKF_status
      - report_gravity_norm_and_dynamic_acceleration_mean_RMS_P99
      - flag_observed_scale_unit_conversion_static_offset_residual_motion_and_EKF_failures
    unit_correction_policy: report_only_no_automatic_correction
    cache_audit_checks:
      - search_historical_window_caches_and_hash_each_cache
      - inspect_arrays_dtypes_shapes_paths_labels_participants_roles_file_indices_and_provenance
      - freshly_regenerate_legacy_windows_from_current_CSV_bytes
      - compare_row_identity_shape_hash_max_and_mean_absolute_difference
      - compare_selected_B_and_R4_windows_for_at_least_one_participant_per_class
      - declare_byte_equivalence_unproven_if_source_preprocess_or_schema_hashes_are_absent
      - write_historical_cache_not_available_when_no_cache_exists
    split_audit_checks:
      - read_repeat0_directly_from_frozen_registry
      - verify_folds_0_to_4_and_each_of_29_participants_held_out_exactly_once
      - verify_outer_train_and_held_out_participant_disjointness
      - verify_all_files_and_windows_inherit_participant_fold
      - verify_class_consistency_and_declared_registry_file_and_payload_hashes
    split_runtime_recompute: false
    audit_decisions: [PASS, STOP, PASS_WITH_DECLARED_LIMITATIONS]
    training_input_source: fresh_current_raw_csv_bytes_independent_of_phase0
    historical_cache_use: audit_only_never_training
    historical_cache_mismatch_training_effect: none
    audit_outputs:
      - artifacts/audit/legacy_v2_manifest_record_diff.csv
      - artifacts/audit/legacy_v2_source_hash_audit.csv
      - artifacts/audit/legacy_v2_source_hash_audit.json
      - artifacts/audit/legacy_v2_channel_qc.csv
      - artifacts/audit/legacy_v2_participant_alias_map.csv
      - artifacts/audit/legacy_v2_imu_unit_ekf_audit.csv
      - artifacts/audit/legacy_v2_cache_audit.json
      - artifacts/audit/legacy_v2_split_audit.json
      - artifacts/audit/LEGACY_V2_PHASE0_DATA_AUDIT.md
    advisory_findings:
      - source_hash_mismatch_unresolved
      - historical_static_set_differs_from_v2
      - role_class_or_participant_identity_conflict
      - participant_alias_not_one_to_one
      - required_channel_missing_or_semantics_ambiguous
      - duplicate_records_unresolved
      - participant_leakage_or_split_registry_mismatch
  budget:
    case_count: 9
    repeat_indices: [0]
    fold_indices: [0, 1, 2, 3, 4]
    training_seed: 42
    fixed_epochs: 10
    early_stopping: false
    outer_label_checkpoint_selection: false
    fit_count: 45
    model_epoch_count: 450
    phase0_fit_count: 0
    phase0_model_epoch_count: 0
