# Extreme-compute-saving Stage 2 supplement. Reuse the already completed r0
# evidence for canonical Raw CompactCNN, canonical Raw InceptionFull and
# Feature-vector LogisticRegressionL2. This plan runs only the three missing
# canonical comparisons; it does not import or relabel the earlier artifacts.
schema_version: ppg_frailty.study_plan.v2
study:
  study_id: staged_static_02_competitive_routes_models_v2
  kind: catalog_sweep
  purpose: "Complete the missing one-repeat Raw and Feature-vector model comparisons while reusing already reviewed r0 evidence."
  flow_position: "Stage 2 after representation screening and before bridge/ensemble work; ShapeFormer is deferred to stage last."
  decision_role: candidate_comparison
  reference_case_id: null
  thesis_sections:
    - "Within-representation architecture comparison"
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
  scope: selected_ordinary
search:
  method: deterministic_sparse_profiles
  selection_seed: 42
  runtime_sampling: false
  interpretation: "Three-case canonical r0 supplement; combine its report manually with the declared reused r0 evidence."
  controlled_factors:
    - "Same participants, repeat 0 and all five held-out folds, Line B, signal preparation, windows and aggregation"
    - "Quality off; identity reducer; motion override disabled"
    - "Canonical model parameters; no optimizer or representation grid"
  notes:
    - "Reuse Raw CompactCNN and Logistic r0 from artifacts/studies/static_line_b_staged_v2/20260818_234543_catalog_sweep_staged-static-01-representation-baselines-v2."
    - "Reuse Raw InceptionFull 400 Hz r0 from artifacts/studies/20260817_214823_catalog_sweep_static-line-b-all-models-v2/raw/inception_full__fs400_reference."
    - "The new report covers only these three supplemental cases; the reused evidence remains separately identified and must be reviewed alongside it."
    - "Every generated report shows canonical Line B plus Line A equal-file post-hoc aggregation sensitivity; Line A is not separate training or selection evidence."
    - "ShapeFormer and ensemble entries are intentionally excluded."
cases:
  # Missing canonical Raw comparison.
  - case_id: raw__inception_small
    catalog_entry: inception_small
    screen_profile_id: canonical
    output_group: raw
    overrides: {}
    rationale: "Complete the missing canonical 400 Hz InceptionSmall r0 comparison."
    formal_profile: null
  # Missing canonical Feature-vector comparisons.
  - case_id: feature_vector__rbf_svm
    catalog_entry: rbf_svm
    screen_profile_id: canonical
    output_group: feature_vector
    overrides: {}
    rationale: "Complete the missing canonical nonlinear feature-vector r0 comparison."
    formal_profile: null
  - case_id: feature_vector__extra_trees
    catalog_entry: extra_trees
    screen_profile_id: canonical
    output_group: feature_vector
    overrides: {}
    rationale: "Complete the missing canonical tree-ensemble feature-vector r0 comparison."
    formal_profile: null
execution:
  repeats: [0]
  folds: [0, 1, 2, 3, 4]
  jobs: 1
  parallel_level: cases
  continue_on_error: true
  allow_parallel_deep: false
  measure_operational_costs: false
output:
  root: artifacts/studies/static_line_b_staged_v2
report:
  top_k: 10
  write_html: true
  write_static_figures: true
  calibration_bins: 10
