# Stage 2 supplement. The older 400 Hz InceptionFull evidence is not reused
# because it does not match the selected B0/B2/B7 state. CompactCNN and
# Logistic remain supplied by the rerun Stage 1 plan.
schema_version: ppg_frailty.study_plan.v2
study:
  study_id: staged_static_02_competitive_routes_models_v2
  kind: catalog_sweep
  purpose: "Complete the one-repeat InceptionFull/InceptionSmall and feature-vector comparisons at the selected V2-core plus B0/B2/B7 state."
  flow_position: "Stage 2 after representation screening and before bridge/ensemble work; ShapeFormer is deferred to stage last."
  decision_role: candidate_comparison
  reference_case_id: null
  thesis_sections:
    - "Within-representation architecture comparison"
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
  scope: selected_ordinary
search:
  method: deterministic_sparse_profiles
  selection_seed: 42
  runtime_sampling: false
  interpretation: "Four-case r0 supplement; combine it only with matching selected-state Stage 1 evidence."
  controlled_factors:
    - "Same participants, repeat 0 and all five held-out folds; raw Inception uses V2-core plus selected B0/B2/B7 state"
    - "Quality off; identity reducer; motion override disabled"
    - "Canonical model parameters; no optimizer or representation grid"
  notes:
    - "Use Raw CompactCNN and Logistic only from a rerun Stage 1 with the same selected-state profile."
    - "Do not reuse the older 400 Hz InceptionFull result; this plan reruns InceptionFull at 64 Hz and 5/2.5 s."
    - "The new report covers four supplemental cases and must be reviewed alongside the matching Stage 1 report."
    - "Every generated report shows canonical Line B plus Line A equal-file post-hoc aggregation sensitivity; Line A is not separate training or selection evidence."
    - "ShapeFormer and ensemble entries are intentionally excluded."
cases:
  - case_id: raw__inception_full
    catalog_entry: inception_full
    screen_profile_id: v2_core_b0_b2_b7_selected
    output_group: raw
    overrides: &b0_b2_b7_dl
      signal.dl_resampling.enabled: true
      signal.dl_resampling.target_fs_hz: 64.0
      signal.normalization.raw_ppg: per_window_median_iqr_over_1p349_sd_finite
      signal.normalization.raw_imu: none
      windows.raw_dl.length_s: 5.0
      windows.raw_dl.hop_s: 2.5
      training.optimizer: adamw
      training.batch_size: 32
      training.sampler: exhaustive_shuffle_without_replacement
      training.class_weighting: outer_train_window_inverse_frequency
      training.class_count_basis: row
      aggregation.balance_line: line_b_equal_role_families
    rationale: "Rerun InceptionFull at the selected state; older 400 Hz evidence is incompatible."
    formal_profile: null
  # InceptionSmall under the exact same selected-state profile.
  - case_id: raw__inception_small
    catalog_entry: inception_small
    screen_profile_id: v2_core_b0_b2_b7_selected
    output_group: raw
    overrides:
      <<: *b0_b2_b7_dl
    rationale: "Complete the missing InceptionSmall comparison at 64 Hz, 5/2.5 s, AdamW/batch32 and B7 Line B aggregation."
    formal_profile: null
  # Missing canonical Feature-vector comparisons.
  - case_id: feature_vector__rbf_svm
    catalog_entry: rbf_svm
    screen_profile_id: canonical
    output_group: feature_vector
    overrides: {}
    rationale: "Complete the missing canonical nonlinear feature-vector r0 comparison."
    formal_profile: null
  - case_id: feature_vector__extra_trees
    catalog_entry: extra_trees
    screen_profile_id: canonical
    output_group: feature_vector
    overrides: {}
    rationale: "Complete the missing canonical tree-ensemble feature-vector r0 comparison."
    formal_profile: null
execution:
  repeats: [0]
  folds: [0, 1, 2, 3, 4]
  jobs: 1
  device: cuda
  parallel_level: cases
  continue_on_error: true
  allow_parallel_deep: false
  measure_operational_costs: false
output:
  root: artifacts/studies/static_line_b_staged_v2
report:
  top_k: 4
  write_html: true
  write_static_figures: true
  calibration_bins: 10
  figure_modules: [all]
  compact_mean_sd: true
  write_excel_workbook: true
