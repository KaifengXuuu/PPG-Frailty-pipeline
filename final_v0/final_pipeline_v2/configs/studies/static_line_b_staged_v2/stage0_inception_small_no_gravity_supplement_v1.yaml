# One-case supplement for the completed all-role Full/Small InceptionTime
# architecture study. It is trained separately, then merged read-only with the
# completed studies so no already-finished case is retrained.
schema_version: ppg_frailty.study_plan.v2
study:
  study_id: stage0_inception_small_no_gravity_supplement_v1
  kind: catalog_sweep
  purpose: "Add the tuned all-role InceptionTimeSmall case with gravity estimation/subtraction disabled for later merged comparison."
  flow_position: "Stage 0 supplemental model run before read-only final-case report merge."
  decision_role: ablation
  reference_case_id: tuned_all_roles__inception_small_no_gravity
  thesis_sections:
    - "All-role InceptionTimeSmall gravity-removal ablation supplement"
    - "Merged Full/Small architecture and IMU preprocessing comparison"
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
  scope: selected_ordinary
search:
  method: deterministic_sparse_profiles
  selection_seed: 42
  runtime_sampling: false
  interpretation: "One prespecified supplemental case only; the causal comparison is produced after read-only merge with the completed matched InceptionTimeSmall Profile-A case."
  controlled_factors:
    - "Registered InceptionTimeSmall: 64-channel module output, bottleneck 16, 16 filters per branch and depth 3"
    - "RED, IR and six physical IMU channels; all B/R/S/W roles"
    - "64 Hz DL input; 5 s windows; 2.5 s hop; all-eight per-window robust scaling; cap 128 windows per file"
    - "AdamW; fixed 10 epochs; batch 16; LR 3e-4; WD .001; dropout .50; label smoothing .20"
    - "Exhaustive shuffle; row-count inverse-frequency class weights; Line B aggregation; SQI/motion/denoiser off"
  notes:
    - "The only intended difference from tuned_all_roles__inception_small in the completed architecture study is the registered IMU gravity profile."
    - "SI conversion, same-participant B-record sensor-bias calibration and zero-phase 20/40 Hz sensor filtering remain enabled."
    - "No gravity vector is estimated or subtracted; the three acceleration input channels retain calibrated sensor-filtered acceleration including gravity."
cases:
  - case_id: tuned_all_roles__inception_small_no_gravity
    catalog_entry: inception_small
    screen_profile_id: tuned_all_roles_inception_small_no_gravity_fixed10
    output_group: raw
    overrides:
      signal.imu.gravity_method: sensor_filter_only_no_gravity_removal
      signal.imu.comparison_method: profile_a_lowpass_0p3hz
      signal.dl_resampling.enabled: true
      signal.dl_resampling.target_fs_hz: 64.0
      signal.normalization.raw_ppg: per_window_robust
      signal.normalization.raw_imu: none
      windows.raw_dl.length_s: 5.0
      windows.raw_dl.hop_s: 2.5
      windows.raw_dl.end_alignment: include_right_aligned_if_distinct
      windows.raw_dl.padding: none_complete_windows_only
      windows.raw_dl.min_valid_fraction: 1.0
      windows.raw_dl.cap_per_file: 128
      windows.raw_dl.cap_fraction_per_file: null
      model.dropout: 0.50
      training.fixed_epochs: 10
      training.batch_size: 16
      training.optimizer: adamw
      training.learning_rate: 0.0003
      training.weight_decay: 0.001
      training.label_smoothing: 0.20
      training.sampler: exhaustive_shuffle_without_replacement
      training.class_weighting: inverse_frequency
      training.class_count_basis: row
      training.classifier_role_families: [B, R, S, W]
      aggregation.balance_line: line_b_equal_role_families
      roles: [B, R1, R2, R3, R4, S1, S2, W1, W2]
      quality.mode: "off"
      artifact.motion_detector_enabled: false
      artifact.denoiser_enabled: false
      artifact.reducer: identity
      artifact.reducer_version: identity_v1
      artifact.degraded_policy: drop
      artifact.parameters: {}
    rationale: "Separate tuned all-role Small InceptionTime run with the registered no-gravity-removal IMU ablation."
    formal_profile: null
execution:
  repeats: [0, 1, 2, 3, 4]
  folds: [0, 1, 2, 3, 4]
  jobs: 1
  device: cuda
  parallel_level: cases
  continue_on_error: false
  allow_parallel_deep: false
  measure_operational_costs: false
  preprocessing_cache:
    mode: read_write
    root: artifacts/studies/cache
    namespaces:
      - imu_calibration
      - canonical_signal_views
      - raw_windows
    verify_source_sha256: true
output:
  root: artifacts/studies/static_line_b_staged_v2
report:
  top_k: 1
  detailed_configuration_top_k: 5
  write_html: true
  write_static_figures: true
  calibration_bins: 10
  figure_modules: [all]
  compact_mean_sd: true
  write_excel_workbook: true
