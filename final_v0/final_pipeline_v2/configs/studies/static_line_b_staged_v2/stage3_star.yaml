    - class_weight_vector
    - sampler_identity
  restrictions:
    - no_additional_cases_repeats_models_or_hyperparameter_search
    - only_same_model_B0_to_B1_through_B7_contrasts
    - no_adjacent_Bk_to_Bk_plus_1_contrasts
    - no_cross_model_ablation_contrasts
    - all_aggregation_views_from_same_OOF_window_probabilities
    - B0_and_B7_training_inputs_and_window_probabilities_must_match_by_model
    - sampling_diagnostics_saved_for_every_fold_and_epoch
  required_runtime_capabilities:
    - explicit_profile_controls_runtime_dispatch_without_B_id_algorithm_switches
    - legacy_and_calibrated_EKF_IMU_preprocessing_independent_of_PPG_preprocessing
    - all_eight_per_window_and_PPG_window_plus_outer_train_IMU_fold_normalization
    - exhaustive_shuffle_and_line_B_weighted_sampler_profiles
    - historical_outer_train_window_count_class_weights
    - AdamW_batch32_and_Adam_batch64_training_profiles
    - same_OOF_window_probability_replay_for_W_line_A_and_line_B_views
