    screen_profile_id: legacy_bridge_b2_star
    output_group: raw
    overrides: {}
    rationale: "CompactCNN B0 with only the window length/hop changed to 5/2.5 seconds."
    formal_profile: null
  - case_id: inception_full__b2_star_fixed10
    catalog_entry: inception_full
    screen_profile_id: legacy_bridge_b2_star
    output_group: raw
    overrides: {}
    rationale: "InceptionTimeFull B0 with only the window length/hop changed to 5/2.5 seconds."
    formal_profile: null
  - case_id: compact_cnn__b3_star_fixed10
    catalog_entry: compact_cnn
    screen_profile_id: legacy_bridge_b3_star
    output_group: raw
    overrides: {}
    rationale: "CompactCNN B0 with only IMU semantics changed to calibrated EKF dynamic acceleration."
    formal_profile: null
  - case_id: inception_full__b3_star_fixed10
