legacy_bridge:
  schema_version: ppg_frailty.legacy_v2_bridge_protocol.v1
  design: centered_star_v1
  protocol_id: stage3_two_model_centered_star_fixed10
  source_specification: "inline:legacy_bridge.effective_controls"
  source_specification_sha256: adc116fb9d80e06acc0b871d96e3ce2037ac0867d118f0198ca9efdd38691137
  runtime_status: implemented_field_driven_centered_star_v1
  budget:
    case_count: 16
    repeat_indices: [0, 1, 2, 3, 4]
    fold_indices: [0, 1, 2, 3, 4]
    training_seed: 42
    fixed_epochs: 10
    early_stopping: false
    outer_label_checkpoint_selection: false
    fit_count: 400
    model_epoch_count: 4000
    phase0_fit_count: 0
    phase0_model_epoch_count: 0
  execution_order:
    - compact_cnn__B0_star_fixed10
    - inception_full__B0_star_fixed10
    - compact_cnn__B1_star_fixed10
    - inception_full__B1_star_fixed10
    - compact_cnn__B2_star_fixed10
    - inception_full__B2_star_fixed10
    - compact_cnn__B3_star_fixed10
    - inception_full__B3_star_fixed10
    - compact_cnn__B4_star_fixed10
    - inception_full__B4_star_fixed10
    - compact_cnn__B5_star_fixed10
    - inception_full__B5_star_fixed10
    - compact_cnn__B6_star_fixed10
    - inception_full__B6_star_fixed10
    - compact_cnn__B7_star_fixed10
    - inception_full__B7_star_fixed10
  baseline_controls:
    ppg_preprocessing: legacy_detrend_bandpass_0p2_8
    imu_preprocessing: legacy_filtered_axes
    target_fs_hz: 64
    window_seconds: 15.0
    hop_seconds: 3.0
    historical_retained_fraction: 0.9
    max_windows_per_file: null
    allow_short_record_padding: true
    normalization: per_window_all_eight
    sampler: exhaustive_shuffle_without_replacement
    class_weighting: outer_train_window_inverse_frequency
    optimizer: adamw
    batch_size: 32
    fixed_epochs: 10
    learning_rate: 0.001
    weight_decay: 0.0001
    training_metric_aggregation_rule: line_a_equal_files
    primary_report_aggregation_view: window_balanced_to_participant
  factor_overrides:
    B1:
      factor_id: sampling_rate
      overrides: {target_fs_hz: 400}
      expected_changed_paths: [controls.target_fs_hz]
      interpretation: "Target sample rate only: 64 to 400 Hz."
    B2:
      factor_id: window_plan
      overrides: {window_seconds: 5.0, hop_seconds: 2.5}
      expected_changed_paths: [controls.window_seconds, controls.hop_seconds]
      interpretation: "Window plan only: 15/3 to 5/2.5 seconds; retain fraction 0.9 and no cap."
    B3:
      factor_id: imu_preprocessing
      overrides: {imu_preprocessing: calibrated_ekf_adyn}
      expected_changed_paths: [controls.imu_preprocessing]
      interpretation: "IMU semantics only: legacy axes to calibrated EKF dynamic acceleration."
    B4:
      factor_id: normalization
      overrides: {normalization: ppg_window_imu_outer_train_fold}
      expected_changed_paths: [controls.normalization]
      interpretation: "Normalization only: all-eight per-window to PPG-window plus outer-train IMU-fold scaling."
    B5:
      factor_id: sampler
      overrides: {sampler: balance_line_weighted_v2}
      expected_changed_paths: [controls.sampler]
      interpretation: "Sampler only: exhaustive uniform shuffle to Line B weighted sampling."
    B6:
      factor_id: optimizer_and_batch_size
      overrides: {optimizer: adam, batch_size: 64}
      expected_changed_paths: [controls.optimizer, controls.batch_size]
      interpretation: "Declared training bundle only: AdamW/batch32 to Adam/batch64."
    B7:
      factor_id: primary_aggregation
      overrides: {primary_report_aggregation_view: line_b_equal_role_families}
      expected_changed_paths: [controls.primary_report_aggregation_view]
      interpretation: "Native primary reporting only: direct-window participant mean to file/role participant mean."
  profiles:
    - {case_id: compact_cnn__B0_star_fixed10, catalog_case_id: compact_cnn__b0_star_fixed10, model_id: CompactCNN1D, profile_id: B0}
    - {case_id: inception_full__B0_star_fixed10, catalog_case_id: inception_full__b0_star_fixed10, model_id: InceptionTimeFull, profile_id: B0}
    - {case_id: compact_cnn__B1_star_fixed10, catalog_case_id: compact_cnn__b1_star_fixed10, model_id: CompactCNN1D, profile_id: B1}
    - {case_id: inception_full__B1_star_fixed10, catalog_case_id: inception_full__b1_star_fixed10, model_id: InceptionTimeFull, profile_id: B1}
    - {case_id: compact_cnn__B2_star_fixed10, catalog_case_id: compact_cnn__b2_star_fixed10, model_id: CompactCNN1D, profile_id: B2}
    - {case_id: inception_full__B2_star_fixed10, catalog_case_id: inception_full__b2_star_fixed10, model_id: InceptionTimeFull, profile_id: B2}
    - {case_id: compact_cnn__B3_star_fixed10, catalog_case_id: compact_cnn__b3_star_fixed10, model_id: CompactCNN1D, profile_id: B3}
    - {case_id: inception_full__B3_star_fixed10, catalog_case_id: inception_full__b3_star_fixed10, model_id: InceptionTimeFull, profile_id: B3}
    - {case_id: compact_cnn__B4_star_fixed10, catalog_case_id: compact_cnn__b4_star_fixed10, model_id: CompactCNN1D, profile_id: B4}
    - {case_id: inception_full__B4_star_fixed10, catalog_case_id: inception_full__b4_star_fixed10, model_id: InceptionTimeFull, profile_id: B4}
    - {case_id: compact_cnn__B5_star_fixed10, catalog_case_id: compact_cnn__b5_star_fixed10, model_id: CompactCNN1D, profile_id: B5}
    - {case_id: inception_full__B5_star_fixed10, catalog_case_id: inception_full__b5_star_fixed10, model_id: InceptionTimeFull, profile_id: B5}
    - {case_id: compact_cnn__B6_star_fixed10, catalog_case_id: compact_cnn__b6_star_fixed10, model_id: CompactCNN1D, profile_id: B6}
    - {case_id: inception_full__B6_star_fixed10, catalog_case_id: inception_full__b6_star_fixed10, model_id: InceptionTimeFull, profile_id: B6}
    - {case_id: compact_cnn__B7_star_fixed10, catalog_case_id: compact_cnn__b7_star_fixed10, model_id: CompactCNN1D, profile_id: B7}
    - {case_id: inception_full__B7_star_fixed10, catalog_case_id: inception_full__b7_star_fixed10, model_id: InceptionTimeFull, profile_id: B7}
  aggregation_views:
    - window_balanced_to_participant
    - line_a_equal_files
    - line_b_equal_role_families
  primary_table_columns:
