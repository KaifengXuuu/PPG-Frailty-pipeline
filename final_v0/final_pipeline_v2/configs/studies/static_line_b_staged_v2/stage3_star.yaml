    screen_profile_id: legacy_bridge_b1_star
    output_group: raw
    overrides: {}
    rationale: "CompactCNN B0 with only target sample rate changed from 64 to 400 Hz."
    formal_profile: null
  - case_id: inception_full__b1_star_fixed10
    catalog_entry: inception_full
    screen_profile_id: legacy_bridge_b1_star
    output_group: raw
    overrides: {}
    rationale: "InceptionTimeFull B0 with only target sample rate changed from 64 to 400 Hz."
    formal_profile: null
  - case_id: compact_cnn__b2_star_fixed10
