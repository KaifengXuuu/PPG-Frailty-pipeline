# Stage 3 centered-star ablation: two raw architectures, one common B0, and
# seven independent B0-to-Bk changes. The declared 16 cases contain 400 outer
# cells (five frozen repeats x five frozen folds).
schema_version: ppg_frailty.study_plan.v2
study:
  study_id: staged_static_03_centered_star_v1
  kind: catalog_sweep
  purpose: "Estimate seven single-factor B0-to-Bk effects independently for CompactCNN and InceptionTimeFull."
  flow_position: "Restarted Stage 3 before ensemble, SQI/motion, finalist ablations, and stage-last ShapeFormer."
  decision_role: ablation
  reference_case_id: compact_cnn__b0_star_fixed10
  thesis_sections:
    - "Centered legacy-to-V2 raw-model ablation"
    - "Architecture-specific paired-fold sensitivity"
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
  scope: selected_ordinary
search:
  method: deterministic_sparse_profiles
  selection_seed: 42
  runtime_sampling: false
  interpretation: "B0 is the centre. Every B1-B7 case changes only its declared factor from B0; no adjacent Bk-to-B(k+1) or cross-model contrast is permitted."
  controlled_factors:
    - "Frozen repeats 0-4 and frozen folds 0-4"
    - "Training seed 42"
    - "Ten fixed epochs without early stopping or outer-label checkpoint selection"
    - "Identical model-neutral B profile controls for both architectures"
  notes:
    - "Eight profiles times two models produce 16 cases and 400 repeat/fold cells."
    - "B7 changes only the native primary report aggregation; its training inputs and OOF window probabilities must equal B0 within each model."
cases:
  - case_id: compact_cnn__b0_star_fixed10
    catalog_entry: compact_cnn
    screen_profile_id: legacy_bridge_b0_star
    output_group: raw
    overrides: {}
    rationale: "CompactCNN complete legacy-input fixed-10 baseline."
    formal_profile: null
  - case_id: inception_full__b0_star_fixed10
    catalog_entry: inception_full
    screen_profile_id: legacy_bridge_b0_star
    output_group: raw
    overrides: {}
    rationale: "InceptionTimeFull under the identical model-neutral B0 controls."
    formal_profile: null
  - case_id: compact_cnn__b1_star_fixed10
