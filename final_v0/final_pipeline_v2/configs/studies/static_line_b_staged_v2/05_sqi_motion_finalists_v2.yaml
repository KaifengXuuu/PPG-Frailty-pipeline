# Stage 5 is intentionally split by current implementation status.
# Runnable now: quality off versus diagnostics_only for manually retained
# finalists. diagnostics_only must not change retention or predictions.
# Planned, not runnable from this file: supervised SQI routing, motion override,
# denoiser efficacy, formal motion 5x5, A3 and A4 endpoint comparisons.
# The planned motion sequence is deliberately non-Cartesian:
# 5B) 8-channel axes+EKF reference versus 11-channel derived augmentation;
# 5C) selected channel profile with EKF versus Profile-A LPF;
# 5D) reducer off versus one selected denoiser;
# 5E) selected motion branch versus the paired pure-static finalist.
#
# Before running, replace or delete the example finalist blocks below so that
# only models retained by Stages 1-4 remain.
schema_version: ppg_frailty.study_plan.v2
study:
  study_id: staged_static_05_sqi_diagnostics_finalists_v2
  kind: catalog_sweep
  purpose: "Check SQI diagnostic observability on retained static finalists while preserving identical prediction behavior."
  flow_position: "Stage 5 runnable diagnostic slice before deferred SQI routing and motion-line competition."
  decision_role: robustness
  reference_case_id: null
  thesis_sections:
    - "SQI diagnostics without classification effect"
    - "Deferred motion detector and denoiser branches"
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
  scope: selected_ordinary
search:
  method: deterministic_sparse_profiles
  selection_seed: 42
  runtime_sampling: false
  interpretation: "Paired off/diagnostics-only checks per example finalist; this is not a motion-efficacy comparison."
  controlled_factors:
    - "Static model, representation, participants, folds and training parameters are identical within each pair"
    - "Artifact reducer remains identity and motion override remains disabled"
    - "diagnostics_only has classification_effect none"
  notes:
    - "Predictions, retention and participant OOF rows must match within each pair."
    - "Supervised quality routing remains fail-closed and is not enabled here."
    - "Planned motion comparisons are 8-channel EKF reference versus 11-channel augmentation, and EKF versus Profile-A LPF."
    - "After those single-factor choices, compare reducer off with one selected denoiser, then compare the selected motion branch with pure static."
    - "Formal motion 5x5, reducer selection, A3/A4 runners and motion override remain deferred."
cases:
  - case_id: raw_compact__quality_off
    catalog_entry: compact_cnn
    screen_profile_id: quality_off
    output_group: raw
    overrides:
      quality.mode: "off"
    rationale: "Example raw finalist static reference."
    formal_profile: null
  - case_id: raw_compact__quality_diagnostics
    catalog_entry: compact_cnn
    screen_profile_id: quality_diagnostics
    output_group: raw
    overrides:
      quality.mode: diagnostics_only
    rationale: "Example raw finalist with non-causal SQI diagnostics."
    formal_profile: null
  - case_id: vector_logistic__quality_off
    catalog_entry: logistic_regression
    screen_profile_id: quality_off
    output_group: feature_vector
    overrides:
      quality.mode: "off"
    rationale: "Example feature-vector finalist static reference."
    formal_profile: null
  - case_id: vector_logistic__quality_diagnostics
    catalog_entry: logistic_regression
    screen_profile_id: quality_diagnostics
    output_group: feature_vector
    overrides:
      quality.mode: diagnostics_only
    rationale: "Example feature-vector finalist with non-causal SQI diagnostics."
    formal_profile: null
  - case_id: matrix_rocket__quality_off
    catalog_entry: rocket_numpy
    screen_profile_id: quality_off
    output_group: feature_matrix
    overrides:
      quality.mode: "off"
    rationale: "Example feature-matrix finalist static reference."
    formal_profile: null
  - case_id: matrix_rocket__quality_diagnostics
    catalog_entry: rocket_numpy
    screen_profile_id: quality_diagnostics
    output_group: feature_matrix
    overrides:
      quality.mode: diagnostics_only
    rationale: "Example feature-matrix finalist with non-causal SQI diagnostics."
    formal_profile: null
  - case_id: fusion_compact__quality_off
    catalog_entry: fusion_compact
    screen_profile_id: quality_off
    output_group: fusion
    overrides:
      quality.mode: "off"
    rationale: "Example fusion finalist static reference."
    formal_profile: null
  - case_id: fusion_compact__quality_diagnostics
    catalog_entry: fusion_compact
    screen_profile_id: quality_diagnostics
    output_group: fusion
    overrides:
      quality.mode: diagnostics_only
    rationale: "Example fusion finalist with non-causal SQI diagnostics."
    formal_profile: null
execution:
  repeats: [0, 1, 2, 3, 4]
  folds: [0, 1, 2, 3, 4]
  jobs: 1
  parallel_level: cases
  continue_on_error: true
  allow_parallel_deep: false
output:
  root: artifacts/studies/static_line_b_staged_v2
report:
  top_k: 8
  write_html: true
  write_static_figures: true
  calibration_bins: 10
