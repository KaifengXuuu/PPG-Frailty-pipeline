schema_version: ppg_frailty.study_plan.v2
study:
  study_id: static_line_b_all_models_v2
  kind: catalog_sweep
  purpose: "Preliminary pure-static Line B screening of the 10 active ordinary candidates with a small deterministic set of broad, model-relevant profiles."
  flow_position: "First model-family screen before deeper single-factor ablations, ensemble tests, and manual final-use-case selection."
  decision_role: screening
  reference_case_id: null
  thesis_sections:
    - "Static B/R1-R4 frailty classification"
    - "Line B role-aware aggregation"
    - "Three currently model-backed representation branches; feature-matrix model pending"
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
  scope: ordinary_active
search:
  method: deterministic_sparse_profiles
  selection_seed: 42
  runtime_sampling: false
  interpretation: "Random-search-style sparse screening with predeclared profiles; descriptive screening, not a single-factor causal ablation."
  controlled_factors:
    - "All 29 participants; static roles B, R1, R2, R3, R4 only"
    - "Frozen participant-level 5x5 outer-CV registry and repeat split seeds"
    - "Line B: window to file to role to participant; equal role families"
    - "Canonical 400-Hz acquisition/feature grid; separate lower-rate DL views only for registered fixed-kernel cases"
    - "Butterworth 0.2-8 Hz zero-phase PPG filter"
    - "Calibrated roll-pitch EKF with same-participant static calibration"
    - "Quality off; no SQI gate, supervised motion detector, route exclusion, or motion denoiser"
    - "Identity artifact reducer"
    - "Raw windows 5 s / 2.5 s hop; engineering windows 10 s / 2 s hop"
    - "Frailty raw input: RED, IR, A_dyn_x, A_dyn_y, A_dyn_z, GX, GY, GZ"
    - "Deep models: fixed 10 epochs, batch 64, Adam, canonical sampler/loss/class weighting"
    - "Classical models do not consume epoch or Adam fields"
    - "No ensemble/comparator entries and no automatic winner selection"
  notes:
    - "selection_seed documents profile design only; no parameters are sampled at runtime"
    - "CompactCNN and raw InceptionFull use registered 100/200/400-Hz profiles without optimizer changes"
    - "ShapeFormer discovery and architecture parameters remain frozen"
    - "The active scope contains only registered non-comparator, non-ensemble candidates; ROCKET-family routes are retired."
cases:
