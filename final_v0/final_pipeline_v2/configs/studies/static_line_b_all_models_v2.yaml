    catalog_entry: compact_cnn
    screen_profile_id: fs100
    output_group: raw
    overrides: {}
    rationale: "Registered fixed-kernel DL input at 100 Hz; all optimizer controls remain fixed."
    formal_profile:
      family: fixed_kernel_samples
      profile_id: compactcnn1d__fs_100
  - case_id: compact_cnn__fs200
