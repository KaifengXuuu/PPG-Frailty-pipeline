schema_version: ppg_frailty.study_plan.v2
study:
  study_id: staged_static_06_regularization_grid_v1__full_cv
  kind: catalog_sweep
  purpose: Compare the declared weight-decay, dropout and label-smoothing profiles
    on the batch/LR-selected InceptionTimeFull state. Phase=full_cv.
  flow_position: Stage 6 regularization tuning after batch/LR successive halving.
  decision_role: screening
  reference_case_id: null
  thesis_sections:
  - InceptionTime regularization profile comparison
catalog:
  path: configs/formal_experiment_catalog_v2.yaml
  balance_line: line_b
  scope: selected_ordinary
search:
  method: deterministic_sparse_profiles
  selection_seed: 42
  runtime_sampling: false
  interpretation: Declared full_cv tuning phase; no final-test claim and no automatic
    final-model selection.
  controlled_factors:
  - Participant-grouped registered splits and split seeds
  - V2-core plus selected B0/B2/B7 DL state
  - 'Fixed resource: epochs=10, repeats=[0, 1, 2, 3, 4], folds=[0, 1, 2, 3, 4]'
  notes:
  - Candidate ranking is tuning-only and cannot be reported as independent validation.
  - Every candidate uses the same declared resource within this phase.
cases:
- case_id: r1_wd001_do03_ls01
  catalog_entry: inception_full
  screen_profile_id: v2_core_b0_b2_b7_selected
  output_group: raw
  overrides:
    signal.dl_resampling.enabled: true
    signal.dl_resampling.target_fs_hz: 64.0
    signal.normalization.raw_ppg: per_window_median_iqr_over_1p349_sd_finite
    signal.normalization.raw_imu: none
    windows.raw_dl.length_s: 5.0
    windows.raw_dl.hop_s: 2.5
    training.optimizer: adamw
    training.sampler: exhaustive_shuffle_without_replacement
    training.class_weighting: outer_train_window_inverse_frequency
    training.class_count_basis: row
    aggregation.balance_line: line_b_equal_role_families
    training.batch_size: 16
    training.learning_rate: 0.0003
    training.weight_decay: 0.001
    model.dropout: 0.3
    training.label_smoothing: 0.1
    training.fixed_epochs: 10
  rationale: R1 declared regularization profile.
  formal_profile: null
